# QSM.jl is deliberately absent. CLEARSWI does not call it: the --qsm path goes
# through MriResearchTools.qsm_B0, and the backend the compiled app depends on is
# QuantitativeSusceptibilityMappingTGV. Loading QSM.jl here only exercised a
# dependency's optional backend, and it dragged in that backend's problems -
# QSM 0.5.4 calls FFTW.libfftw3[], which throws on FFTW >= 1.9, so the test
# environment had to cap FFTW to keep CLEARSWI's suite resolvable. Upstream has
# had no release since 2023-12-03 and no response to kamesy/QSM.jl#13.
